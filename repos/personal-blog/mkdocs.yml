site_name: Sutliff
site_url: https://blog.ffilt.us/
hooks:
  - hooks/scheduled_posts.py
site_description: >-
  Personal blog of Reed Sutliff — a developer passionate about open source,
  API design, automation, and software engineering.
site_author: Reed Sutliff
copyright: Copyright &copy; 2026 Reed Sutliff
extra:
  tags:
    Opinion: opinion
    UiPath : uipath
    Engineering : eng
    C# : c-sharp
    Azure Pipelines: azure-pipelines
    Github Actions: github-actions
    AsyncAPI : asyncapi
    OpenAPI : openapi
    Azure Functions : azure-functions
    Azure : azure
    MkDocs: mkdocs
    Tutorial: tutorial
    JSON: json
    Python: python
    TypeScript: typescript
  social:
    - icon: material/email-fast
      link: mailto:reed@ffilt.us
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/reed-sutliff-21213b114/
    - icon: fontawesome/brands/github
      link: https://github.com/reedsutliff
    - icon: fontawesome/solid/rss
      link: /feed_rss_created.xml
theme:
  name: material
  custom_dir: theme/
  logo: assets/logo.png
  icon:
    tag:
      opinion: material/thought-bubble
      uipath : custom/uipath
      eng : material/laptop
      asyncapi : custom/asyncapi
      python : simple/python
      c-sharp : simple/csharp
      azure-pipelines: simple/azurepipelines
      github-actions: simple/githubactions
      json: simple/json
      tutorial: material/directions
      azure-functions: custom/azure-functions
      azure: custom/azure
      openapi : custom/openapi
      mkdocs : custom/mkdocs
      typescript : simple/typescript
    repo: fontawesome/brands/git-alt 
  favicon: assets/logo.png
  font:
    text: Inter
  features:
    - content.code.copy
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.tabs.link
  palette:
    - scheme: default
      primary: custom
      accent: custom
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      logo: assets/logo.svg
    - scheme: slate
      primary: custom
      accent: custom
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      logo: assets/logo.svg
plugins:
  macros: {}
  tags: 
    tags_file: tags.md
  blogging:
    template: docs/assets/custom-blog.html
    features:
      tags: {}
    categories:
      - name: tutorial
        template: docs/assets/custom-blog.html
        features:
          tags: {}
        dirs:
          - blog/tutorials
      - name: opinion
        template: docs/assets/custom-blog.html
        features:
          tags: {}
        dirs:
          - blog/opinions
    dirs:
      - blog
  search : {}
  exclude-search:
    exclude:
      - __nav.md
      - /*/_nav.md
  include-markdown : {}
  glightbox: {}
  kroki:
    FencePrefix: 'kroki-'
    EnableBlockDiag: true
    EnableMermaid: true
    HttpMethod: 'POST'
    DownloadImages: true
  literate-nav:
    nav_file: _nav.md
    implicit_index: true
extra_css:
  - assets/theme.css
extra_javascript:
  - assets/js/main.js
markdown_extensions:
  toc : {}
  footnotes : {}
  meta : {}
  admonition : {}
  pymdownx.details : {}
  pymdownx.highlight:
    anchor_linenums: true
  pymdownx.inlinehilite : {}
  pymdownx.snippets : {}
  pymdownx.tabbed: 
    alternate_style: true 
  attr_list : {}
  def_list : {}
  md_in_html : {}
  pymdownx.emoji:
    emoji_index: !!python/name:materialx.emoji.twemoji
    emoji_generator: !!python/name:materialx.emoji.to_svg
    options:
      custom_icons:
        - theme/.icons
  pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format