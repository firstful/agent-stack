$(hostname) = fuse.ffilt.us

storage.imapsql local_mailbox {
    driver sqlite3
    dsn /data/maddy.db
}

queue local_queue {
    target remote_out
}

delivery.remote remote_out {
    mx_check false
}

smtp tcp://0.0.0.0:2525 {
    auth off
    storage local_mailbox
    pipeline {
        deliver_to local_mailbox
        default {
            deliver_to local_queue
        }
    }
}
