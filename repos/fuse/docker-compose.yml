version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fuse-postgres
    environment:
      POSTGRES_USER: fuselocal
      POSTGRES_PASSWORD: fuselocalpw
      POSTGRES_DB: fuse
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuselocal"]
      interval: 5s
      timeout: 5s
      retries: 5

  maddy:
    image: maddyproject/maddy:latest
    container_name: fuse-maddy
    volumes:
      - ./maddy.conf:/config/maddy.conf:ro
    ports:
      - "25:25"
      - "587:587"
      - "2525:2525"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: fuse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fuselocal
      MINIO_ROOT_PASSWORD: fuselocalpw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build: .
    container_name: fuse-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      maddy:
        condition: service_started
      minio:
        condition: service_healthy
    volumes:
      - ./packages:/app/packages:delegated
    command: npm run dev

volumes:
  postgres_data:
  minio_data:
