# Rewrite: when the plugin calls /obsidian-vault/_node/... (server config endpoint),
# strip the database prefix so CouchDB receives the correct path.
# This allows the user to enter http://...@obsidian.ffilt.us/obsidian-vault as the URI.
server {
    listen 8080;
    location ~ ^/obsidian-vault/_node/ {
        rewrite ^/obsidian-vault(.*)$ $1 break;
        proxy_pass http://host.containers.internal:4006;
    }
}
