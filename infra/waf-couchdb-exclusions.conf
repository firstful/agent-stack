# ──────────────────────────────────────────────────────────────
# OWASP CRS Exclusion Rules for CouchDB / Obsidian LiveSync
# ──────────────────────────────────────────────────────────────
# CouchDB uses PUT/DELETE methods and document content may
# contain patterns that look like SQLi/XSS/RCE but are legitimate
# markdown / code content.
#
# These rules apply only to /obsidian-vault/ paths.

# ── CouchDB requires PUT and DELETE methods ──
SecRule REQUEST_URI "@beginsWith /obsidian-vault/" \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=911100"

# ── CouchDB document bodies are JSON — disable body parsing rules ──
SecRule REQUEST_URI "@beginsWith /obsidian-vault/" \
    "id:10002,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=911200"

# ── Disable all SQL injection (attack-sqli) rules for CouchDB ──
# Note content may contain SQL keywords in code examples
SecRule REQUEST_URI "@beginsWith /obsidian-vault/" \
    "id:10010,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveByTag=attack-sqli"

# ── Disable all XSS (attack-xss) rules for CouchDB ──
# Note content may contain HTML/JS in code examples
SecRule REQUEST_URI "@beginsWith /obsidian-vault/" \
    "id:10020,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveByTag=attack-xss"

# ── Disable all Command Execution (attack-rce) rules ──
# Note content may contain shell commands in code blocks
SecRule REQUEST_URI "@beginsWith /obsidian-vault/" \
    "id:10030,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveByTag=attack-rce"

# ── Disable all Path Traversal (attack-ptrav) rules ──
# Note paths and content may contain ".." references
SecRule REQUEST_URI "@beginsWith /obsidian-vault/" \
    "id:10040,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveByTag=attack-ptrav"

# ── Disable all Local File Inclusion (attack-lfi) rules ──
SecRule REQUEST_URI "@beginsWith /obsidian-vault/" \
    "id:10050,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveByTag=attack-lfi"

# ── Disable all Remote File Inclusion (attack-rfi) rules ──
SecRule REQUEST_URI "@beginsWith /obsidian-vault/" \
    "id:10055,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveByTag=attack-rfi"
SecRule REQUEST_URI "@beginsWith /obsidian-vault/" \
    "id:10060,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveByTag=attack-generic"

# ── Disable Protocol Attack rules (rule 920230 etc.) ──
# E2EE-encrypted content contains `%=<base64>` which includes `%`
# characters that ModSecurity misinterprets as URL-encoding attacks.
SecRule REQUEST_URI "@beginsWith /obsidian-vault/" \
    "id:10070,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveByTag=attack-protocol"

# ── Disable REQBODY_ERROR check (rule 200002) for CouchDB ──
# Obsidian sync sends large _bulk_docs payloads (up to 4.5MB) that
# exceed SecRequestBodyNoFilesLimit (128KB default).
SecRule REQUEST_URI "@beginsWith /obsidian-vault/" \
    "id:10080,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=200002"
