# Redis configuration for Groupthink
# Persistence: AOF + RDB for maximum durability

# AOF persistence — log every write operation
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots as fallback
save 900 1
save 300 10
save 60 10000

# General
dir /data
loglevel notice
