version: 0.8
index_id: otel-logs-v1
doc_mapping:
  field_mappings:
    - name: timestamp_nanos
      type: datetime
      input_formats:
        - unix_timestamp
      output_format: unix_timestamp_micros
      fast: true
      fast_precision: seconds
    - name: body
      type: text
      tokenizer: default
      record: position
    - name: severity_text
      type: text
    - name: severity_number
      type: u64
    - name: service_name
      type: text
    - name: resource_attributes
      type: json
    - name: scope_name
      type: text
    - name: scope_version
      type: text
    - name: attributes
      type: json
    - name: trace_id
      type: text
    - name: span_id
      type: text
  timestamp_field: timestamp_nanos
  index_field_presence: true
search_settings:
  default_search_fields: [body]
indexing_settings:
  commit_timeout_secs: 10
